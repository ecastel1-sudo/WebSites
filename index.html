  <style>
    :root {
      /* New palette */
      --primary: #6B9080;
      --secondary: #A4C3B2;
      --accent: #CCE3DE;
      --background: #F6FFF8;
      --background-alt: #EAF4F4;
      --text-main: #1b2520;
      --text-muted: #4f6458;
      --border-subtle: #CCE3DE;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--background);
      color: var(--text-main);
      /* keep original font-family and base font-size */
      font-family: /* original font-family here */ sans-serif;
      font-size: 16px; /* keep original if different */
    }

    /* Example general styles – keep sizes, only update colors */

    a {
      color: var(--primary);
      text-decoration: none;
    }

    a:hover {
      color: var(--secondary);
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #ffffff;
    }

    header .nav-link {
      color: #F6FFF8;
    }

    header .nav-link:hover {
      color: var(--accent);
    }

    .hero {
      background: radial-gradient(circle at top left, var(--background-alt), var(--background));
      color: var(--text-main);
    }

    .hero-cta {
      background-color: var(--primary);
      color: #F6FFF8;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
    }

    .hero-cta:hover {
      background-color: var(--secondary);
    }

    section {
      background-color: var(--background);
    }

    .section-alt {
      background-color: var(--background-alt);
    }

    .card {
      background-color: #ffffff;
      border: 1px solid var(--border-subtle);
    }

    .card-title {
      color: var(--primary);
    }

    .card-text {
      color: var(--text-muted);
    }

    footer {
      background-color: var(--primary);
      color: #F6FFF8;
    }

    footer a {
      color: #F6FFF8;
    }

    footer a:hover {
      color: var(--accent);
    }

    /* Any SVG or icon fills using old colors should be updated to the new palette */

    .pill {
      background-color: var(--accent);
      color: var(--text-main);
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
    }

    /* Preserve original spacing, sizes, layout-related properties from the template */
  </style>
</head>
